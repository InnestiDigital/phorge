name: Release

# Two trigger paths:
#
#   1. workflow_dispatch — bumps version, tags, publishes (semver-controlled
#      from the GitHub Actions UI). Use this for normal releases.
#
#   2. push tags v* — publishes whatever is at the tag (no version bump).
#      Use this if you bumped + tagged locally and want CI to publish.
#
# Required secrets:
#   NPM_TOKEN — npm automation token (granular access, write on the package).
#               If absent, publish step is skipped (dry-run mode).
#
# Required permissions:
#   contents: write — push version commit + tag, create release
#   id-token: write — npm provenance attestation

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semver bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: phorge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # GH Actions does not reliably evaluate `secrets.X != ''` in `if:` or
      # job/workflow-level `env:`. Step-level `env:` does expand secrets, so
      # we capture the presence into a step output via shell.
      - name: Detect NPM_TOKEN
        id: npmtoken
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify
        run: |
          npm run typecheck
          npm run test
          npm run build

      - name: Configure git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version (workflow_dispatch only)
        id: bump
        if: github.event_name == 'workflow_dispatch'
        run: |
          NEW_VERSION=$(npm version ${{ inputs.release_type }} -m "chore(release): v%s")
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_VERSION}"     >> "$GITHUB_OUTPUT"

      - name: Push commit and tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: git push --follow-tags

      - name: Resolve tag (push tag trigger)
        id: tag
        if: github.event_name == 'push'
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.npmtoken.outputs.available == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Skip npm publish (no NPM_TOKEN)
        if: steps.npmtoken.outputs.available != 'true'
        run: echo "NPM_TOKEN not set — skipping npm publish (dry-run)."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag || steps.tag.outputs.tag }}
          name: ${{ steps.bump.outputs.tag || steps.tag.outputs.tag }}
          generate_release_notes: true
